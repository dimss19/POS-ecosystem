version: '3.8'

services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kasir-pos-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    networks:
      - kasir-pos-network
    depends_on:
      - db
      - redis

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: kasir-pos-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - kasir-pos-network
    depends_on:
      - app

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: kasir-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kasir-pos-network

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: kasir-pos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - kasir-pos-network
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  # Laravel Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kasir-pos-queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - kasir-pos-network
    depends_on:
      - app
      - db
      - redis
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

  # Laravel Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kasir-pos-scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - kasir-pos-network
    depends_on:
      - app
      - db
      - redis
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"

networks:
  kasir-pos-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
